<style>

</style></head><body><main>
<div class="top"><div><h1>⚗️ 腳本鍊成</h1><small>依專業結構理論，鍊出可直接拍攝的腳本</small></div><div><button class="b g" id="cfgb">⚙ AI 設定 <small id="cfgst"></small></button> <button class="b g" id="shTool">分享工具</button> <button class="b g" id="shRes" disabled>分享結果</button></div></div>

<div class="ctl"><span>數量 <input type="number" id="cnt" min="1" max="10" value="3" style="width:64px;padding:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)"> <small>(上限10)</small></span>
<span>發想 <span class="seg" id="segA"><button data-v="multi_angle" class="on">多角度</button><button data-v="unified">統一方向</button></span></span>
<span>目標 <span class="seg" id="segG"><button data-v="finished" class="on">成品優先</button><button data-v="inspire">靈感優先</button><button data-v="mix">混合</button></span> <select id="ratio" data-tip="靈感比例（僅混合模式）：自動＝約1/3為靈感稿；20%＝以成品為主偶爾來點腦洞；40%＝成品略多；60%＝靈感略多；80%＝以靈感為主，只留少數成品。" style="width:auto;padding:4px;margin:0;display:none"><option value="auto">自動比例</option><option value="20">靈感20%</option><option value="40">靈感40%</option><option value="60">靈感60%</option><option value="80">靈感80%</option></select></span><span>AI 服務 <button type="button" class="chip" id="cfgb2">⚙ 設定</button> <small id="cfgst2" class="mu"></small></span><span>速度 <span class="seg" id="segM"><button data-v="quick">⚡快速</button><button data-v="default" class="on">🎯品質</button></span></span></div></div>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="b" id="go">開始鍊成</button><button class="b g" id="pause" style="display:none">⏸ 暫停</button><button class="b g" id="stop" style="display:none;margin-left:auto;border-color:var(--er);color:var(--er)">■ 停止</button></div>
<div class="bar" id="bar" style="display:none"><i></i></div><div id="st" class="mu" style="margin:6px 0"></div><div id="out"></div></main>

<div id="bot"><div class="bub" id="bub">…</div><div class="catw"><button id="mute" data-tip="靜音小助理的閒聊（警告與互動仍會出現）">🔔</button><div class="cat" id="cat"></div></div></div>
<div id="mod"><div class="box" id="box"></div></div>

<script>

"直播":{scope:["帶貨直播","活動直播","知識直播","開箱直播"],dur:["30分鐘","60分鐘","120分鐘"],platform:["抖音／Reels（9:16）","YouTube 橫式（16:9）","不限"],goal:["導購轉換","提升曝光","名單收集"],style:["熱情互動","輕鬆搞笑","沉穩專業","快節奏"]},

const optsFor=(k,c)=>{if(c.loose&&k!=="type"&&!FREE.has(k)){const A={topic:[...Object.values(TOP).flat(),...OPT.topic],audience:[...Object.values(AUD).flat(),...OPT.audience],tone:OPT.tone};return [...new Set(A[k]||Object.values(T).flatMap(x=>x[k]))]}const t=T[c.type];if(k==="type")return Object.keys(T);if(k==="topic")return TOP[c.scope]||OPT.topic;if(k==="audience")return AUD[c.scope]||OPT.audience;if(["scope","dur","platform","style","goal"].includes(k))return t?t[k]:[...new Set(Object.values(T).flatMap(x=>x[k]))];return OPT[k]||[]};

function repPrompt(r,ex){return `${r.q&&String(r.q.level).includes("靈感")?"這是一份靈感稿，請把它發展成完整、可拍攝、貼合時長的腳本，保留核心創意與反轉。\n":""}請在不改變既定條件的前提下，補完或優化下面這份影片腳本。\n${condTxt(r.c)}\n結構理論：${r.theory}\n現有腳本：${JSON.stringify({title:r.title,rows:r.rows})}\n已知問題與建議：${JSON.stringify(r.q||{})}\n使用者補充資訊：${ex||"（無）"}\n只保留欄位：${r.cols.join("、")}\n若資訊仍不足，仍盡力補完並如實標註品質。`}
$("#out").addEventListener("input",e=>{if(e.target.classList.contains("ex")){S.ex=S.ex||{};S.ex[e.target.dataset.i]=e.target.value}});
$("#out").addEventListener("click",async e=>{const f=e.target.closest(".fix"),c=e.target.closest(".cpp");if(!f&&!c)return;const i=+(f||c).dataset.i,r=S.res[i],ex=(S.ex||{})[i]||"";
if(c)return cpx(repPrompt(r,ex));
f.disabled=true;f.textContent="補完中…";$("#st").textContent="小助理正在補完第 "+(i+1)+" 支…";
try{const o=await sam(repPrompt(r,ex)+"\n只輸出JSON："+SCH().replace(/\[\{[^}]*\}\]/,'[{'+r.cols.map(k=>`"${k}":""`).join(",")+'}]'));S.res[i]={...r,sparks:o.sparks||r.sparks,title:o.title||r.title,theory:o.theory_used||r.theory,angle:o.angle_summary||r.angle,rows:(o.content&&o.content.rows)||r.rows,warn:o.warnings,q:o.quality};$("#st").textContent="已補完第 "+(i+1)+" 支"}catch(err){$("#st").textContent="補完失敗，原內容已保留（"+errReason(err)+"），可改用「複製補完指令」交給其他 AI"}
render()});
const tb=(i,all)=>`<div class="tb" data-i="${i}" style="margin:6px 0;display:flex;gap:6px;align-items:center"><button class="chip cpy">📋 ${all?"複製全部":"複製"}</button><select class="dls" style="width:auto;padding:3px 8px;margin:0"><option value="">⬇ ${all?"下載全部":"下載"}…</option><option value="txt">.txt 純文字</option><option value="md">.md Markdown</option><option value="csv">.csv 表格</option><option value="json">.json</option><option value="html">.html 網頁</option><option value="docx">.docx Word</option><option value="pdf">.pdf</option></select></div>`;
const cond=r=>"條目："+FD.map(([k,n])=>r.c[k]?n+"＝"+r.c[k]:"").filter(Boolean).join("｜")+"｜格式＝"+r.fmt+(r.q&&r.q.level&&!String(r.q.level).includes("完整")?"\n品質："+r.q.level+"；原因："+(r.q.reasons||[]).join("；")+"；建議："+(r.q.todo||[]).map(t=>t.tip||t).join("；"):"");
const SER={txt:l=>l.map((r,i)=>`#${i+1} ${r.title}\n理論：${r.theory}｜角度：${r.angle}\n`+r.rows.map(x=>r.cols.map(c=>c+"："+(x[c]??"")).join("\n")).join("\n---\n")+`\n\n${cond(r)}`).join("\n\n=========\n\n"),
md:l=>l.map((r,i)=>`## #${i+1} ${r.title}\n\n> 理論：${r.theory}｜角度：${r.angle}\n\n| ${r.cols.join(" | ")} |\n| ${r.cols.map(()=>"---").join(" | ")} |\n`+r.rows.map(x=>"| "+r.cols.map(c=>String(x[c]??"").replace(/\|/g,"\\|").replace(/\n/g," ")).join(" | ")+" |").join("\n")+`\n\n*${cond(r)}*`).join("\n\n"),
csv:l=>{const cols=[...new Set(l.flatMap(r=>r.cols))],q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';return "\uFEFF"+[["編號","標題","理論","角度",...cols].map(q).join(","),...l.flatMap((r,i)=>r.rows.map(x=>[i+1,r.title,r.theory,r.angle,...cols.map(c=>x[c])].map(q).join(",")))].join("\r\n")},
json:l=>JSON.stringify(l,null,2),
html:l=>`<!doctype html><meta charset="utf-8"><title>腳本鍊成</title><style>body{font:15px/1.6 sans-serif;max-width:800px;margin:auto;padding:16px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px;vertical-align:top}th{background:#eef}</style>`+l.map((r,i)=>`<h2>#${i+1} ${esc(r.title)}</h2><p>理論：${esc(r.theory)}｜角度：${esc(r.angle)}</p><table><tr>${r.cols.map(c=>"<th>"+esc(c)+"</th>").join("")}</tr>${r.rows.map(x=>"<tr>"+r.cols.map(c=>"<td>"+esc(x[c])+"</td>").join("")+"</tr>").join("")}</table><p><small>${esc(cond(r))}</small></p>`).join("")};
async function cpx(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();if(!ok)return prompt("請手動複製：",t)}$("#st").textContent="已複製 ✅"}
const H2C="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",JSP="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const lib=(u,g)=>window[g]?Promise.resolve():new Promise((ok,no)=>{const t=document.createElement("script");t.src=u;t.onload=ok;t.onerror=()=>no({message:"套件載入失敗"});document.head.append(t)});
async function BIN(f,l){if(SER[f])return SER[f](l);$("#st").textContent="產生檔案中…";
if(f==="docx"){await lib("https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js","docx");const D=docx,P=t=>new D.Paragraph(String(t==null?"":t)),cell=t=>new D.TableCell({children:[P(t)]}),ch=[];l.forEach((r,i)=>{ch.push(new D.Paragraph({text:`#${i+1} ${r.title}`,heading:D.HeadingLevel.HEADING_2}),P(`理論：${r.theory}｜角度：${r.angle}`),new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows:[new D.TableRow({children:r.cols.map(cell)}),...r.rows.map(x=>new D.TableRow({children:r.cols.map(c=>cell(x[c]))}))]}),P(cond(r)),P(""))});return D.Packer.toBlob(new D.Document({sections:[{children:ch}]}))}
if(f==="pdf"){await lib(H2C,"html2canvas");await lib(JSP,"jspdf");const el=document.createElement("div");el.style.cssText="position:fixed;left:-9999px;top:0;width:760px;padding:24px;background:#fff;color:#111;font:15px/1.6 sans-serif";el.innerHTML=SER.html(l);document.body.append(el);try{const cv=await html2canvas(el,{scale:2,backgroundColor:"#fff"}),pdf=new jspdf.jsPDF("p","pt","a4"),W=595.28,ph=Math.floor(cv.width*841.89/W);for(let y=0,n=0;y<cv.height;y+=ph,n++){const c=document.createElement("canvas");c.width=cv.width;c.height=Math.min(ph,cv.height-y);c.getContext("2d").drawImage(cv,0,y,cv.width,c.height,0,0,cv.width,c.height);if(n)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,W,c.height*W/cv.width)}return pdf.output("blob")}finally{el.remove()}}}
async function dl(fmt,l){try{const d=await BIN(fmt,l),mt={csv:"text/csv",json:"application/json",html:"text/html",md:"text/markdown"}[fmt]||"text/plain",bl=d instanceof Blob?d:new Blob([d],{type:mt+";charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=("腳本鍊成-"+(l.length>1?"全部":l[0].title.slice(0,20))+"."+fmt).replace(/[\\/:*?"<>|\s]+/g,"_");document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){$("#st").textContent="下載失敗："+(e.message||e.code)}}
$("#out").addEventListener("click",e=>{const b=e.target.closest(".cpy");if(!b)return;const i=b.closest(".tb").dataset.i;cpx(SER.txt(i==="all"?S.res:[S.res[+i]]))});
$("#out").addEventListener("change",e=>{if(!e.target.classList.contains("dls")||!e.target.value)return;const i=e.target.closest(".tb").dataset.i;dl(e.target.value,i==="all"?S.res:[S.res[+i]]);e.target.value=""});
function render(){$("#out").innerHTML=(S.res.length>1?tb("all",1):"")+S.res.map(card).join("");$("#shRes").disabled=!S.res.length}
const wait=()=>new Promise(r=>{const t=setInterval(()=>{if(!S.paused||!S.run){clearInterval(t);r()}},300)});
function setRun(on){S.run=on;if(on)setTimeout(()=>{if(S.run)say(pick(GR),"grumble",1)},5000);$("#go").disabled=on;$("#pause").style.display=$("#stop").style.display=on?"":"none";$("#bar").style.display=on?"block":"none";if(!on){S.paused=false;$("#pause").textContent="⏸ 暫停";const sb=$("#stop");delete sb.dataset.arm;sb.textContent="■ 停止"}}
$("#pause").onclick=()=>{S.paused=!S.paused;$("#pause").textContent=S.paused?"▶ 繼續":"⏸ 暫停";$("#st").textContent=S.paused?"已暫停（進行中的一支完成後停下）":""};
$("#stop").onclick=()=>{const b=$("#stop");if(!b.dataset.arm){b.dataset.arm=1;b.textContent="再按一次確認停止";clearTimeout(b._t);b._t=setTimeout(()=>{delete b.dataset.arm;b.textContent="■ 停止"},3000);return}delete b.dataset.arm;b.textContent="■ 停止";S.run=0;S.paused=false;S.ab?.abort();$("#st").textContent="已停止"};
$("#go").onclick=async()=>{if(!S.cfg.key){await openCfg({ok:false,t:"請先設定你的 AI 服務與金鑰，才能開始鍊成"});if(!S.cfg.key)return}S.noAI=null;S.noAI=null;
let n=Math.max(1,Math.min(10,+$("#cnt").value||1));if(!S.flds.size)return ask("<p>請至少勾選一個輸出欄位。</p>","w",[["好","x",1]]);
if(!S.f.type||!S.f.topic){if(await ask("<p>類型或主題還沒填，要我用隨機補齊嗎？</p>","w",[["取消","n"],["隨機補齊","y",1]])!=="y")return}
fillAuto();let base=conds();S.res=[];render();setRun(1);$("#st").textContent="小助理檢查條件中…";
try{const rv=await review(n);if(!rv){setRun(0);$("#st").textContent="";return}base=rv.base;n=rv.n;const th=rv.th;const gl=planGoals(n);
const prev=[];
for(let i=0;i<n&&S.run;i++){if(S.paused)await wait();if(!S.run)break;
const c=S.mode==="chaos"&&i>0?roll(S.f,gl[i]==="inspire"):base;$("#st").textContent=`生成第 ${i+1}/${n} 支…`;$("#bar i").style.width=(i/n*100)+"%";
let r;const thn=S.theory==="auto"?(S.mode==="chaos"?"auto":th):S.theory;try{r=await nodeB(c,thn,i+1,n,prev,gl[i])}catch(e){if(e&&e.code==="cancelled")throw e;r=await rescue(c,thn,i+1,n,prev,e)}if(!S.run)break;
prev.push(r.angle_summary);S.res.push({title:r.title,theory:r.theory_used||th,angle:r.angle_summary,rows:r.content?.rows||[],cols:[...S.flds],warn:r.warnings,sparks:r.sparks||[],gm:gl[i],q:r.quality?{...r.quality,reasons:[...(r.quality.reasons||[]),...(S.skipNote?[S.skipNote]:[])]}:(S.skipNote?{level:"完整",reasons:[S.skipNote],todo:[]}:undefined),c,fmt:S.fmt,mode:S.angle});render();{const L=lvOf(S.res[S.res.length-1].q);if(L==="事故")say("這支出了點事故，往下看提示。","panic",1);else if(L==="靈感")say("靈感稿出爐，腦洞請小心接住。","laugh",1)}}
$("#bar i").style.width="100%";if(S.run){$("#st").textContent=`完成，共 ${S.res.length} 支`;say("鍊好了！要誇我可以直接說。","star",2)}}
catch(e){fail(e)}
setRun(0)};

// share
const cp=async t=>{try{await navigator.clipboard.writeText(t);ask("<p>連結已複製 ✅</p>","w",[["好","x",1]])}catch(e){prompt("請手動複製：",t)}};
$("#shTool").onclick=()=>cp(location.href.split("#")[0]);
$("#shRes").onclick=()=>cp(location.href.split("#")[0]+"#r="+btoa(unescape(encodeURIComponent(JSON.stringify(S.res)))));
try{const m=location.hash.match(/^#r=(.+)/);if(m){S.res=JSON.parse(decodeURIComponent(escape(atob(m[1]))));render()}}catch(e){}
</script></body></html>
